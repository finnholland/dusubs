# .github/workflows/release-vlc.yaml
name: Release VLC Extension

on:
  push:
    tags:
      - 'vlc-v*'  # Trigger on version tags like vlc-v1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            ./vlc-dualsubs/lua/dualsubs.lua
          generate_release_notes: true
